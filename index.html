<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<title>KAVI · Private Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
:root{
  --bg:#0a0908;--card:#13110e;--card2:#1a1713;--line:rgba(214,177,106,.16);--line2:rgba(214,177,106,.34);
  --gold:#d6b16a;--gold2:#f6e2ae;--goldd:#a27832;--text:#f3ece0;--muted:#968b7a;--dim:#6b6356;
  --ok:#86c9a3;--bad:#e5907f;--r:22px;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
body{min-height:100vh;background:
  radial-gradient(120% 60% at 50% -10%,rgba(214,177,106,.16),transparent 60%),
  radial-gradient(80% 40% at 100% 100%,rgba(162,120,50,.08),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin:0 -16px;
  background:linear-gradient(180deg,rgba(10,9,8,.92),rgba(10,9,8,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(214,177,106,.08)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#2a2218,#120f0b);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(246,226,174,.15)}
.brand b{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.22em;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--goldd));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:9.5px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-top:-3px}
.chip-btn{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(214,177,106,.06);font-size:13px;font-weight:600;color:var(--gold2);display:flex;align-items:center;gap:8px;cursor:pointer}
.chip-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip-btn.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(134,201,163,.18)}
.chip-btn.warn{color:var(--bad);border-color:rgba(229,144,127,.4)}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{position:relative;border-radius:var(--r);background:linear-gradient(180deg,#17140f,#100e0b);border:1px solid var(--line);padding:18px;margin-top:14px}
.hero{padding:22px 20px 18px;overflow:hidden;background:
  radial-gradient(90% 80% at 100% 0%,rgba(214,177,106,.20),transparent 60%),
  linear-gradient(160deg,#1f1a12,#0f0d0a 70%);border-color:var(--line2)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(246,226,174,.06) 50%,transparent 60%)}
.eyebrow{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.05;margin-top:6px;letter-spacing:.01em;background:linear-gradient(180deg,#fff4d6,var(--gold) 60%,var(--goldd));-webkit-background-clip:text;background-clip:text;color:transparent}
.big span{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.14em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-left:6px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.mini{padding:10px 10px 9px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(214,177,106,.1)}
.mini b{display:block;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 4px}
.sec h2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.02em}
.sec .count{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;margin-top:10px;height:44px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:0;font-size:14px}
.search input::placeholder{color:var(--dim)}
.plan{display:flex;gap:14px;align-items:center;padding:16px;cursor:pointer;transition:border-color .2s,transform .2s}
.plan:active{transform:scale(.985)}
.plan:hover{border-color:var(--line2)}
.gem{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:21px;color:#1a140b;
  background:linear-gradient(145deg,var(--gold2),var(--gold) 50%,var(--goldd));box-shadow:0 6px 18px -6px rgba(214,177,106,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.plan .meta{flex:1;min-width:0}
.plan .name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .sub{font-size:12px;color:var(--muted);margin-top:2px}
.plan .amt{text-align:right}
.plan .amt b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--gold2);line-height:1}
.plan .amt small{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--goldd),var(--gold2));transition:width .6s ease}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:rgba(134,201,163,.3)}
.tag.gold{color:var(--gold2);border-color:var(--line2)}
.tag.bad{color:var(--bad);border-color:rgba(229,144,127,.3)}
.empty{text-align:center;color:var(--muted);padding:34px 18px;font-size:14px}
.empty .ic{width:54px;height:54px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card2)}
.btn{width:100%;height:52px;border:0;border-radius:16px;font-weight:700;font-size:15px;letter-spacing:.02em;cursor:pointer;color:#1a140b;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#b98b3e);box-shadow:0 10px 26px -10px rgba(214,177,106,.6),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line2);box-shadow:none}
.btn.sm{height:40px;font-size:13px;border-radius:12px;width:auto;padding:0 16px}
.btn.danger{background:transparent;border:1px solid rgba(229,144,127,.4);color:var(--bad);box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:13.5px}
.row+.row{border-top:1px dashed rgba(214,177,106,.1)}
.row span{color:var(--muted)}
.row b{font-weight:600;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:16px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
.stat small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--gold2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label.f{display:block;margin-top:12px}
label.f>span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.inp{width:100%;height:50px;padding:0 14px;border-radius:14px;background:#0d0c0a;border:1px solid var(--line);outline:0;font-size:15px;transition:border-color .2s}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--dim)}
.inp:disabled{opacity:.6}
.amount-box{display:flex;align-items:center;gap:10px;margin-top:14px;padding:14px 16px;border-radius:18px;background:#0d0c0a;border:1px solid var(--line2)}
.amount-box input{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--serif);font-size:38px;font-weight:600;color:var(--gold2)}
.amount-box input::placeholder{color:#3d372e}
.amount-box em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{flex:1;min-width:56px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card2);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.chip.on,.chip:hover{color:var(--gold2);border-color:var(--line2);background:rgba(214,177,106,.08)}
.note{margin-top:12px;padding:11px 13px;border-radius:13px;font-size:12.5px;background:rgba(214,177,106,.07);border:1px solid var(--line);color:var(--gold2)}
.note.bad{background:rgba(229,144,127,.07);border-color:rgba(229,144,127,.25);color:var(--bad)}
.toggle{position:relative;width:46px;height:28px;border-radius:99px;background:#2a2620;border:1px solid var(--line);cursor:pointer;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:all .2s}
.toggle.on{background:rgba(214,177,106,.3);border-color:var(--gold)}
.toggle.on::after{left:21px;background:var(--gold2)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;width:calc(100% - 28px);max-width:432px;display:flex;justify-content:space-around;padding:8px;border-radius:24px;
  background:rgba(22,19,15,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 20px 40px -12px rgba(0,0,0,.7)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border:0;background:none;border-radius:17px;cursor:pointer;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.06em;transition:all .2s}
.nav button svg{width:21px;height:21px}
.nav button.active{color:var(--gold2);background:rgba(214,177,106,.09)}
.nav button[hidden]{display:none}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:100%;max-width:460px;max-height:92vh;overflow:auto;transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#1b1712,#0f0d0a 40%);border:1px solid var(--line2);border-bottom:0}
.sheet.open{transform:translate(-50%,0)}
.grab{width:42px;height:4px;border-radius:9px;background:rgba(214,177,106,.3);margin:4px auto 14px}
.sheet h3{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1}
.sheet .x{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.toasts{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;width:calc(100% - 32px);max-width:428px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:15px;background:rgba(26,23,19,.96);border:1px solid var(--line2);font-size:13px;box-shadow:0 14px 30px -10px rgba(0,0,0,.7);animation:tin .3s ease;pointer-events:auto}
.toast.ok{border-color:rgba(134,201,163,.4)}
.toast.bad{border-color:rgba(229,144,127,.45)}
.toast a{color:var(--gold2)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(214,177,106,.25);border-top-color:var(--gold2);animation:sp .8s linear infinite;flex:none;margin-top:1px}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{margin-top:14px;padding:12px 14px;border-radius:16px;display:flex;align-items:center;gap:10px;font-size:13px;border:1px solid var(--line2);background:rgba(214,177,106,.06);color:var(--gold2)}
.banner.bad{border-color:rgba(229,144,127,.35);background:rgba(229,144,127,.06);color:var(--bad)}
.link-box{display:flex;gap:8px;align-items:center;margin-top:10px;padding:6px 6px 6px 14px;border-radius:14px;background:#0d0c0a;border:1px solid var(--line)}
.link-box code{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{margin-top:10px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#16130f,#100e0b);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);transition:transform .2s;margin-top:-4px}
.acc[open]>summary::after{transform:rotate(225deg);margin-top:4px}
.acc .body{padding:0 16px 16px}
.acc .hint{font-size:12px;color:var(--muted);margin-top:-4px}
.hero-cta{text-align:center;padding:28px 20px}
.hero-cta .crest{width:66px;height:66px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#2c2418,#110e0a);border:1px solid var(--line2)}
.hero-cta h3{font-family:var(--serif);font-size:30px;font-weight:600}
.hero-cta p{color:var(--muted);font-size:13.5px;margin:8px auto 18px;max-width:300px}
.perks{display:grid;gap:8px;text-align:left;margin:0 0 18px}
.perks div{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text)}
.perks i{width:22px;height:22px;flex:none;border-radius:8px;display:grid;place-items:center;background:rgba(214,177,106,.1);color:var(--gold2);font-style:normal;font-size:12px}
.foot{text-align:center;color:var(--dim);font-size:11px;margin-top:30px;letter-spacing:.05em}
.foot a{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.skel{height:80px;border-radius:var(--r);margin-top:12px;background:linear-gradient(90deg,#13110e 0%,#1c1914 50%,#13110e 100%);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2l7 7-7 13L5 9l7-7z" stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 9h14M12 2l-3 7 3 13 3-13-3-7" stroke="url(#g)" stroke-width="1.1" stroke-linejoin="round" opacity=".7"/><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="24"><stop stop-color="#f6e2ae"/><stop offset="1" stop-color="#a27832"/></linearGradient></defs></svg></div>
      <div><b>KAVI</b><small>Private Plans</small></div>
    </div>
    <button class="chip-btn" id="connectBtn"><span class="dot"></span><span id="connectTxt">Connect</span></button>
  </header>

  <section class="view active" data-view="home">
    <div id="pausedBanner"></div>
    <div class="card hero">
      <div class="eyebrow">Total Volume</div>
      <div class="big" id="hTotal">—<span>USDT</span></div>
      <div class="minis">
        <div class="mini"><b id="hKavi">—</b><small>Kavi Bought</small></div>
        <div class="mini"><b id="hDone">—</b><small>Completed</small></div>
        <div class="mini"><b id="hDist">—</b><small>Partners</small></div>
      </div>
    </div>
    <div id="refBanner"></div>
    <div class="sec"><h2>Collection</h2><span class="count" id="planCount"></span></div>
    <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#968b7a" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" placeholder="Search plan name or ID"></div>
    <div id="planList"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </section>

  <section class="view" data-view="me">
    <div id="meBody"></div>
  </section>

  <section class="view" data-view="partner">
    <div id="partnerBody"></div>
  </section>

  <section class="view" data-view="admin">
    <div id="adminBody"></div>
  </section>

  <div class="foot">Contract <a id="contractLink" target="_blank" rel="noopener"></a></div>
</div>

<nav class="nav">
  <button data-tab="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 8-8 10-8-10 8-8z"/><path d="M4 11h16"/></svg>Plans</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>Wallet</button>
  <button data-tab="partner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9L12 3z"/></svg>Partner</button>
  <button data-tab="admin" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Admin</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><button class="x" id="sheetX">✕</button><div id="sheetBody"></div></div>
<div class="toasts" id="toasts"></div>

<script>
const CONFIG = Object.assign({
  contract: "0x0f6DCe14ebEfa6011Ee327AAc975C24EcdCFa7BA",
  chainId: 56,
  chainName: "BNB Smart Chain",
  rpc: "https://bsc-dataseed.binance.org",
  explorer: "https://bscscan.com",
  native: { name: "BNB", symbol: "BNB", decimals: 18 }
}, window.KAVI_CONFIG || {});

const ABI = [
  "function owner() view returns (address)",
  "function usdt() view returns (address)",
  "function kavi() view returns (address)",
  "function router() view returns (address)",
  "function walletA() view returns (address)",
  "function walletB() view returns (address)",
  "function feeReceiver() view returns (address)",
  "function walletAShare() view returns (uint256)",
  "function referrerShare() view returns (uint256)",
  "function buyShare() view returns (uint256)",
  "function distributorFee() view returns (uint256)",
  "function minPayment() view returns (uint256)",
  "function paused() view returns (bool)",
  "function totalUsdtReceived() view returns (uint256)",
  "function totalPlanUsdt() view returns (uint256)",
  "function totalDistributorFees() view returns (uint256)",
  "function totalToWalletA() view returns (uint256)",
  "function totalToReferrers() view returns (uint256)",
  "function totalUsdtUsedForBuy() view returns (uint256)",

const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
function short(a) { return a ? a.slice(0, 6) + "…" + a.slice(-4) : "—"; }
function fmt(v, d = S.dec, max = 2) {
  if (v === undefined || v === null) return "—";
  const n = Number(ethers.formatUnits(v, d));
  if (n >= 1e6) return (n / 1e6).toLocaleString("en-US", { maximumFractionDigits: 2 }) + "M";
  if (n >= 1e4) return (n / 1e3).toLocaleString("en-US", { maximumFractionDigits: 1 }) + "K";
  return n.toLocaleString("en-US", { maximumFractionDigits: max });
}
function fmtFull(v, d = S.dec) { return Number(ethers.formatUnits(v, d)).toLocaleString("en-US", { maximumFractionDigits: 4 }); }
function parse(v, d = S.dec) { try { const s = String(v).trim(); if (!s) return null; const x = ethers.parseUnits(s, d); return x; } catch { return null; } }
function pct(a, b) { return b > 0n ? Number((a * 10000n) / b) / 100 : 0; }
function errMsg(e) {
  const m = e?.revert?.args?.[0] || e?.reason || e?.info?.error?.data?.message || e?.info?.error?.message || e?.error?.message || e?.shortMessage || e?.message || "Transaction failed";
  if (/user rejected|denied|ACTION_REJECTED/i.test(m) || e?.code === "ACTION_REJECTED" || e?.code === 4001) return "Request rejected in wallet";
  return String(m).replace(/^execution reverted:?\s*/i, "").replace(/^Error: /, "").slice(0, 160);
}

function toast(msg, type = "", ms = 4200) {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = (type === "load" ? '<div class="spin"></div>' : type === "ok" ? '<span style="color:var(--ok)">✓</span>' : type === "bad" ? '<span style="color:var(--bad)">!</span>' : '<span style="color:var(--gold2)">◆</span>') + "<div>" + msg + "</div>";
  const box = $("#toasts");
  box.appendChild(el);
  const done = [...box.children].filter(x => !x.classList.contains("load"));
  while (done.length > 1 && box.children.length > 2) done.shift().remove();
  if (ms) setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, ms);
  return el;
}

async function send(label, fn) {
  if (!S.cw) { await connect(); if (!S.cw) return false; }
  if (!S.chainOk) { await switchChain(); if (!S.chainOk) return false; }
  const t = toast(label + " — confirm in wallet", "load", 0);
  try {
    const tx = await fn();
    t.lastChild.innerHTML = label + " — processing…";
    const r = await tx.wait();
    t.remove();
    toast(label + " successful · <a target=_blank href='" + CONFIG.explorer + "/tx/" + r.hash + "'>View</a>", "ok", 3800);
    await loadAll();
    return true;
  } catch (e) {
    t.remove();
    toast(errMsg(e), "bad", 6000);
    return false;
  }
}

async function ensureAllowance(amount) {
  const cur = await S.usdt.allowance(S.account, CONFIG.contract);
  if (cur >= amount) return true;
  const tw = S.usdt.connect(S.signer);
  const ok = await send("Approve " + S.sym, () => tw.approve(CONFIG.contract, amount));
  if (ok) return true;
  if (cur > 0n) {
    const z = await send("Reset approval", () => tw.approve(CONFIG.contract, 0));
    if (z) return send("Approve " + S.sym, () => tw.approve(CONFIG.contract, amount));
  }
  return false;
}

async function init() {
  $("#contractLink").textContent = short(CONFIG.contract);
  $("#contractLink").href = CONFIG.explorer + "/address/" + CONFIG.contract;
  const q = new URLSearchParams(location.search);
  const r = q.get("ref");
  if (r && ethers.isAddress(r)) { S.ref = ethers.getAddress(r); try { localStorage.setItem("kavi_ref", S.ref); } catch {} }
  else { try { const s = localStorage.getItem("kavi_ref"); if (s && ethers.isAddress(s)) S.ref = s; } catch {} }

  S.read = new ethers.JsonRpcProvider(CONFIG.rpc, CONFIG.chainId, { staticNetwork: true });
  S.c = new ethers.Contract(CONFIG.contract, ABI, S.read);

  $$(".nav button").forEach(b => b.onclick = () => go(b.dataset.tab));
  $("#connectBtn").onclick = () => S.account ? (S.chainOk ? copy(S.account, "Address copied") : switchChain()) : connect();
  $("#search").oninput = renderPlans;
  $("#scrim").onclick = closeSheet;
  $("#sheetX").onclick = closeSheet;

  if (window.ethereum) {
    window.ethereum.on?.("accountsChanged", () => connect(true));
    window.ethereum.on?.("chainChanged", () => connect(true));
    try {
      const acc = await window.ethereum.request({ method: "eth_accounts" });
      if (acc && acc.length) await connect(true);
    } catch {}
  }
  await loadAll();
}

function go(tab) {
  S.tab = tab;
  $$(".nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  $$(".view").forEach(v => v.classList.toggle("active", v.dataset.view === tab));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function connect(silent) {
  if (!window.ethereum) {
    if (!silent) toast("No wallet found. Open this page in MetaMask, Trust Wallet or TokenPocket browser.", "bad", 7000);
    return;
  }
  try {
    S.wallet = new ethers.BrowserProvider(window.ethereum, "any");
    const accs = await S.wallet.send(silent ? "eth_accounts" : "eth_requestAccounts", []);
    if (!accs.length) { S.account = null; S.signer = null; S.cw = null; updateConnect(); await loadAll(); return; }
    S.signer = await S.wallet.getSigner();
    S.account = ethers.getAddress(accs[0]);
    const net = await S.wallet.getNetwork();
    S.chainOk = Number(net.chainId) === CONFIG.chainId;
    S.cw = new ethers.Contract(CONFIG.contract, ABI, S.signer);
    updateConnect();
    if (!S.chainOk && !silent) await switchChain();
    await loadAll();
  } catch (e) { if (!silent) toast(errMsg(e), "bad"); }
}

async function switchChain() {
  if (!window.ethereum) return;
  const hex = "0x" + CONFIG.chainId.toString(16);
  try {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
  } catch (e) {
    if (e.code === 4902 || /Unrecognized|not added/i.test(e.message || "")) {
      try {
        await window.ethereum.request({ method: "wallet_addEthereumChain", params: [{ chainId: hex, chainName: CONFIG.chainName, rpcUrls: [CONFIG.rpc], nativeCurrency: CONFIG.native, blockExplorerUrls: [CONFIG.explorer] }] });
      } catch (e2) { toast(errMsg(e2), "bad"); return; }
    } else { toast(errMsg(e), "bad"); return; }
  }
  S.wallet = new ethers.BrowserProvider(window.ethereum, "any");
  const net = await S.wallet.getNetwork();
  S.chainOk = Number(net.chainId) === CONFIG.chainId;
  if (S.chainOk) { S.signer = await S.wallet.getSigner(); S.cw = new ethers.Contract(CONFIG.contract, ABI, S.signer); }
  updateConnect();
}

function updateConnect() {
  const b = $("#connectBtn");
  b.classList.toggle("on", !!S.account && S.chainOk);
  b.classList.toggle("warn", !!S.account && !S.chainOk);
  $("#connectTxt").textContent = !S.account ? "Connect" : S.chainOk ? short(S.account) : "Switch network";
}

async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg || "Copied", "ok", 2200); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast(msg || "Copied", "ok", 2200); }
}

let loading = null;
async function loadAll() {
  if (loading) return loading;
  loading = (async () => {
    try {
      const c = S.c;
      const [owner, usdtAddr, kaviAddr, router, wA, wB, feeR, sA, sR, sB, fee, minP, paused, tRecv, tPlan, tFees, tA, tRef, tBuy, tKavi, tPurch, tDone, pCount, dCount] = await Promise.all([
        c.owner(), c.usdt(), c.kavi(), c.router(), c.walletA(), c.walletB(), c.feeReceiver(),
        c.walletAShare(), c.referrerShare(), c.buyShare(), c.distributorFee(), c.minPayment(), c.paused(),
        c.totalUsdtReceived(), c.totalPlanUsdt(), c.totalDistributorFees(), c.totalToWalletA(), c.totalToReferrers(),
        c.totalUsdtUsedForBuy(), c.totalKaviBought(), c.totalPurchases(), c.totalCompletedPlans(), c.planCount(), c.getDistributorCount()
      ]);
      if (S.usdtAddr !== usdtAddr) {
        S.usdtAddr = usdtAddr;
        S.usdt = new ethers.Contract(usdtAddr, ERC20, S.read);
        const [d, s] = await Promise.all([S.usdt.decimals(), S.usdt.symbol().catch(() => "USDT")]);
        S.dec = Number(d); S.sym = s;
      }
      if (S.kaviAddr !== kaviAddr) {
        S.kaviAddr = kaviAddr;
        const k = new ethers.Contract(kaviAddr, ERC20, S.read);
        const [d, s] = await Promise.all([k.decimals(), k.symbol().catch(() => "KAVI")]);
        S.kdec = Number(d); S.ksym = s;
      }
      S.cfg = { owner, router, wA, wB, feeR, sA, sR, sB, fee, minP, paused, tRecv, tPlan, tFees, tA, tRef, tBuy, tKavi, tPurch, tDone, pCount, dCount };

      const n = Number(pCount);
      const start = Math.max(1, n - 199);
      const ids = []; for (let i = n; i >= start; i--) ids.push(i);
      const raw = await Promise.all(ids.map(i => c.plans(i)));
      S.plans = raw.map(p => ({ id: Number(p.id), distributor: p.distributor, name: p.name, amount: p.amount, active: p.active, totalSales: p.totalSales, totalUsdt: p.totalUsdt }));
      const ds = [...new Set(S.plans.map(p => p.distributor))];
      const reg = await Promise.all(ds.map(d => c.isDistributor(d)));
      S.distActive = {}; ds.forEach((d, i) => S.distActive[d] = reg[i]);

      if (S.account) {
        const a = S.account;
        const [bal, tot, cnt, earn, refOf, ups, dist] = await Promise.all([
          S.usdt.balanceOf(a), c.userTotalUsdt(a), c.userPurchaseCount(a), c.referrerEarnings(a), c.referrerOf(a), c.getUserPlans(a), c.getDistributor(a)
        ]);
        S.me = { bal, tot, cnt, earn, refOf };
        S.userPlans = {};
        ups.ids.forEach((id, i) => { const u = ups.list[i]; S.userPlans[Number(id)] = { target: u.target, paid: u.paid, payments: u.payments, completed: u.completed, startedAt: u.startedAt, completedAt: u.completedAt }; });
        S.dist = { registered: dist.registered, joinedAt: dist.joinedAt, planIds: dist.planIds.map(Number), totalUsdt: dist.totalUsdt, totalSales: dist.totalSales };
      } else { S.me = {}; S.userPlans = {}; S.dist = null; }

      renderAll();
    } catch (e) {
      console.error(e);
      $("#planList").innerHTML = '<div class="card empty">Could not load contract data.<br><small>' + esc(errMsg(e)) + '</small></div>';
    } finally { loading = null; }
  })();
  return loading;
}

function planCard(p, opts = {}) {
  const up = S.userPlans[p.id];
  const initial = (p.name.trim()[0] || "K").toUpperCase();
  let sub = "by " + short(p.distributor) + " · " + p.totalSales + " completed";
  let extra = "";
  if (up) {
    const pc = up.completed ? 100 : pct(up.paid, up.target);
    sub = up.completed ? '<span class="tag ok">Completed</span>' : fmt(up.paid) + " / " + fmt(up.target) + " paid";
    extra = '<div class="bar"><i style="width:' + pc + '%"></i></div>';
  }
  if (opts.owner) sub = (p.active ? '<span class="tag ok">Live</span>' : '<span class="tag">Hidden</span>') + " &nbsp;" + p.totalSales + " sold · " + fmt(p.totalUsdt) + " " + esc(S.sym);
  return '<div class="card plan" data-plan="' + p.id + '" data-mode="' + (opts.owner ? "edit" : "pay") + '">' +
    '<div class="gem">' + esc(initial) + '</div>' +
    '<div class="meta"><div class="name">' + esc(p.name) + ' <span style="color:var(--dim);font-weight:500;font-size:12px">#' + p.id + '</span></div><div class="sub">' + sub + '</div>' + extra + '</div>' +
    '<div class="amt"><b>' + fmt(up && !opts.owner ? up.target : p.amount) + '</b><small>' + esc(S.sym) + '</small></div></div>';
}

function bindPlanCards(root) {

}

function renderPlans() {

function openPay(id) {
  const p = S.plans.find(x => x.id === id); if (!p) return;
  const up = S.userPlans[id];
  if (up && up.completed) {
    openSheet('<div class="eyebrow">Plan #' + id + '</div><h3>' + esc(p.name) + '</h3><div class="card hero-cta" style="margin-top:16px"><div class="crest">✓</div><h3>Completed</h3><p>You have fully paid ' + fmtFull(up.target) + ' ' + esc(S.sym) + ' in ' + up.payments + ' payment(s).</p></div>');
    return;
  }
  const target = up ? up.target : p.amount;
  const paid = up ? up.paid : 0n;
  const remaining = target - paid;
  const locked = S.me.refOf && S.me.refOf !== ZERO;
  const refVal = locked ? S.me.refOf : (S.ref || "");
  const g = S.cfg;
  openSheet(
    '<div class="eyebrow">Plan #' + id + ' · by ' + short(p.distributor) + '</div><h3>' + esc(p.name) + '</h3>' +
    '<div class="row" style="margin-top:10px"><span>Plan value</span><b>' + fmtFull(target) + ' ' + esc(S.sym) + '</b></div>' +
    '<div class="row"><span>Paid so far</span><b>' + fmtFull(paid) + ' ' + esc(S.sym) + '</b></div>' +
    '<div class="bar" style="margin:4px 0 2px"><i style="width:' + pct(paid, target) + '%"></i></div>' +
    '<div class="row"><span>Remaining</span><b style="color:var(--gold2)">' + fmtFull(remaining) + ' ' + esc(S.sym) + '</b></div>' +
    '<div class="amount-box"><input id="payAmt" inputmode="decimal" placeholder="0.00" autocomplete="off"><em>' + esc(S.sym) + '</em></div>' +
    '<div class="chips" id="quick"><button class="chip" data-p="25">25%</button><button class="chip" data-p="50">50%</button><button class="chip" data-p="75">75%</button><button class="chip" data-p="100">Full</button></div>' +
    '<div id="payNote"></div>' +
    '<label class="f"><span>Sponsor address ' + (locked ? "· locked" : "· optional") + '</span><input class="inp mono" id="payRef" placeholder="0x… (leave empty for plan distributor)" value="' + esc(refVal) + '"' + (locked ? " disabled" : "") + '></label>' +
    '<div style="margin-top:16px"><button class="btn" id="payBtn" disabled>Enter amount</button></div>' +
    '<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px">' + (S.account ? "Balance " + fmt(S.me.bal) + " " + esc(S.sym) : "Wallet not connected") + '</div>'
  );
  const inp = $("#payAmt");
  const update = async () => {
    const amt = parse(inp.value);
    const btn = $("#payBtn");
    $$("#quick .chip").forEach(c => c.classList.remove("on"));
    if (!amt || amt <= 0n) { btn.disabled = true; btn.textContent = "Enter amount"; $("#payNote").innerHTML = ""; return; }
    const used = amt > remaining ? remaining : amt;
    let note = "";
    if (amt > remaining) note = '<div class="note">◆ Only ' + fmtFull(remaining) + ' ' + esc(S.sym) + ' is needed. The extra ' + fmtFull(amt - remaining) + ' ' + esc(S.sym) + ' will be returned to you instantly.</div>';
    if (g.minP > 0n && amt < g.minP && amt < remaining) note = '<div class="note bad">Minimum payment is ' + fmtFull(g.minP) + ' ' + esc(S.sym) + '.</div>';
    if (S.account && amt > S.me.bal) note = '<div class="note bad">Insufficient balance.</div>';
    $("#payNote").innerHTML = note;
    btn.disabled = !!note && note.includes("bad") || g.paused;
    btn.textContent = g.paused ? "Payments paused" : !S.account ? "Connect wallet" : used === remaining ? "Pay & Complete Plan" : "Pay " + fmtFull(amt) + " " + S.sym;
    if (!S.account) btn.disabled = false;
  };
  inp.oninput = update;
  $$("#quick .chip").forEach(c => c.onclick = () => {
    const v = remaining * BigInt(c.dataset.p) / 100n;
    inp.value = ethers.formatUnits(v, S.dec).replace(/\.0$/, "");
    update().then(() => c.classList.add("on"));
  });
  $("#payBtn").onclick = async () => {
    if (!S.account) { await connect(); if (S.account) openPay(id); return; }
    const amt = parse(inp.value); if (!amt || amt <= 0n) return;
    let ref = ZERO;
    if (!locked) {
      const rv = $("#payRef").value.trim();
      if (rv) { if (!ethers.isAddress(rv)) return toast("Invalid sponsor address", "bad"); ref = ethers.getAddress(rv); }
    }
    const used = amt > remaining ? remaining : amt;
    let minOut = 0n;
    try { const k = await S.c.getExpectedKavi(used); minOut = k * BigInt(10000 - S.slip * 100) / 10000n; } catch {}
    if (!(await ensureAllowance(amt))) return;
    const ok = await send("Payment", () => S.cw.payPlan(id, amt, ref, minOut));
    if (ok) { closeSheet(); const u = S.userPlans[id]; if (u && u.completed) toast("◆ Plan “" + esc(p.name) + "” completed", "ok", 6000); }
  };
  setTimeout(() => inp.focus(), 350);
}

function openEdit(id) {
  const p = S.plans.find(x => x.id === id); if (!p) return;
  let active = p.active;
  openSheet(
    '<div class="eyebrow">Edit Plan #' + id + '</div><h3>' + esc(p.name) + '</h3>' +
    '<div class="grid2" style="margin-top:14px"><div class="stat"><small>Completed</small><b>' + p.totalSales + '</b></div><div class="stat"><small>Volume</small><b>' + fmt(p.totalUsdt) + '</b></div></div>' +
    '<label class="f"><span>Plan name</span><input class="inp" id="epName" maxlength="64" value="' + esc(p.name) + '"></label>' +
    '<label class="f"><span>Amount (' + esc(S.sym) + ')</span><input class="inp" id="epAmt" inputmode="decimal" value="' + ethers.formatUnits(p.amount, S.dec).replace(/\.0$/, "") + '"></label>' +
    '<div class="row" style="margin-top:12px"><span>Visible to users</span><div class="toggle' + (active ? " on" : "") + '" id="epAct"></div></div>' +
    '<div class="note">Users who already started this plan keep their original amount.</div>' +
    '<div style="margin-top:16px"><button class="btn" id="epBtn">Save Changes</button></div>'
  );
  $("#epAct").onclick = e => { active = !active; e.currentTarget.classList.toggle("on", active); };
  $("#epBtn").onclick = async () => {
    const name = $("#epName").value.trim(); const amt = parse($("#epAmt").value);
    if (!name || name.length > 64) return toast("Enter a plan name (max 64 characters)", "bad");
    if (!amt || amt <= 0n) return toast("Enter a valid amount", "bad");
    const isMine = p.distributor.toLowerCase() === S.account?.toLowerCase();
    if (await send("Update plan", () => isMine ? S.cw.updatePlan(id, name, amt, active) : S.cw.adminUpdatePlan(id, name, amt, active))) closeSheet();
  };
}

const ADMIN = [
  { t: "Wallets", fn: "setWallets", f: [["walletA", "Wallet A (50% share)", "addr", () => S.cfg.wA], ["walletB", "Wallet B (receives Kavi)", "addr", () => S.cfg.wB], ["feeR", "Distributor fee receiver", "addr", () => S.cfg.feeR]] },
  { t: "Distribution shares", fn: "setShares", hint: "Basis points · total must be 10000 (5000 = 50%)", f: [["a", "Wallet A", "int", () => S.cfg.sA], ["r", "Referrer", "int", () => S.cfg.sR], ["b", "Kavi buy", "int", () => S.cfg.sB]], check: v => (BigInt(v[0]) + BigInt(v[1]) + BigInt(v[2]) === 10000n) || "Shares must total 10000" },
  { t: "Distributor fee", fn: "setDistributorFee", f: [["fee", "Fee", "usdt", () => S.cfg.fee]] },
  { t: "Minimum payment", fn: "setMinPayment", hint: "0 = any amount allowed", f: [["min", "Minimum", "usdt", () => S.cfg.minP]] },
  { t: "Add distributor", fn: "adminAddDistributor", hint: "Registers without fee", f: [["a", "Address", "addr"]] },
  { t: "Remove distributor", fn: "adminRemoveDistributor", f: [["a", "Address", "addr"]] },
  { t: "Edit any plan", fn: "adminUpdatePlan", f: [["id", "Plan ID", "int"], ["n", "Name", "text"], ["amt", "Amount", "usdt"], ["act", "Active", "bool", () => true]] },
  { t: "Reset user plan", fn: "adminResetUserPlan", hint: "Lets a user pay the plan again from zero", f: [["u", "User address", "addr"], ["id", "Plan ID", "int"]] },
  { t: "Set user sponsor", fn: "adminSetReferrer", f: [["u", "User address", "addr"], ["r", "Sponsor address", "addr"]] },
  { t: "Router", fn: "setRouter", f: [["r", "Router address", "addr", () => S.cfg.router]] },
  { t: "Tokens", fn: "setTokens", hint: "Also resets swap path to USDT → KAVI", f: [["u", "USDT address", "addr", () => S.usdtAddr], ["k", "KAVI address", "addr", () => S.kaviAddr]] },
  { t: "Rescue token", fn: "rescueToken", hint: "Amount in whole tokens", f: [["tk", "Token address", "addr"], ["to", "Send to", "addr"], ["amt", "Amount", "tok"]] },
  { t: "Transfer ownership", fn: "transferOwnership", danger: true, hint: "You will lose admin access", f: [["o", "New owner", "addr"]] }
];

function renderAdmin() {
  const g = S.cfg;
  const prev = new Set($$("#adminBody details[open]").map(d => d.dataset.i));
  $("#adminBody").innerHTML =
    '<div class="card hero"><div class="eyebrow">Admin Console</div><div class="big" style="font-size:34px">' + fmt(g.tPlan) + '<span>' + esc(S.sym) + ' plans</span></div>' +
    '<div class="minis"><div class="mini"><b>' + fmt(g.tFees) + '</b><small>Fees</small></div><div class="mini"><b>' + fmt(g.tRef) + '</b><small>Referrals</small></div><div class="mini"><b>' + g.tPurch + '</b><small>Payments</small></div></div></div>' +
    '<div class="card"><div class="row"><span>Wallet A received</span><b>' + fmtFull(g.tA) + ' ' + esc(S.sym) + '</b></div>' +
    '<div class="row"><span>USDT used for Kavi</span><b>' + fmtFull(g.tBuy) + ' ' + esc(S.sym) + '</b></div>' +
    '<div class="row"><span>Kavi bought</span><b>' + fmtFull(g.tKavi, S.kdec) + ' ' + esc(S.ksym) + '</b></div>' +
    '<div class="row"><span>Shares</span><b>' + Number(g.sA) / 100 + ' / ' + Number(g.sR) / 100 + ' / ' + Number(g.sB) / 100 + ' %</b></div>' +
    '<div class="row"><span>Payments</span><div style="display:flex;align-items:center;gap:10px"><b style="color:' + (g.paused ? "var(--bad)" : "var(--ok)") + '">' + (g.paused ? "Paused" : "Live") + '</b><div class="toggle' + (g.paused ? "" : " on") + '" id="pauseT"></div></div></div></div>' +
    '<div class="sec"><h2>Controls</h2></div>' +
    ADMIN.map((a, i) => '<details class="acc" data-i="' + i + '"' + (prev.has(String(i)) ? " open" : "") + '><summary' + (a.danger ? ' style="color:var(--bad)"' : "") + '>' + a.t + '</summary><div class="body">' + (a.hint ? '<div class="hint">' + a.hint + '</div>' : "") +
      a.f.map(([k, l, ty, pre]) => {
        const v = pre ? pre() : "";
        if (ty === "bool") return '<div class="row" style="margin-top:8px"><span>' + l + '</span><div class="toggle' + (v ? " on" : "") + '" data-k="' + k + '"></div></div>';
        const val = v === "" || v === undefined ? "" : ty === "usdt" ? ethers.formatUnits(v, S.dec).replace(/\.0$/, "") : String(v);
        return '<label class="f"><span>' + l + (ty === "usdt" ? " (" + esc(S.sym) + ")" : "") + '</span><input class="inp' + (ty === "addr" ? " mono" : "") + '" data-k="' + k + '" value="' + esc(val) + '" placeholder="' + (ty === "addr" ? "0x…" : "") + '"' + (ty === "int" || ty === "usdt" || ty === "tok" ? ' inputmode="decimal"' : "") + '></label>';
      }).join("") +
      '<div style="margin-top:14px"><button class="btn' + (a.danger ? " danger" : "") + '" data-run="' + i + '">Update</button></div></div></details>').join("");
  $("#pauseT").onclick = () => send(g.paused ? "Resume payments" : "Pause payments", () => S.cw.setPaused(!g.paused));
  $$("#adminBody .acc .toggle").forEach(t => t.onclick = () => t.classList.toggle("on"));
  $$("#adminBody [data-run]").forEach(b => b.onclick = () => runAdmin(Number(b.dataset.run), b.closest(".body")));
}

async function runAdmin(i, box) {
  const a = ADMIN[i];
  const vals = [], raws = [];
  for (const [k, l, ty] of a.f) {
    const el = box.querySelector('[data-k="' + k + '"]');
    if (ty === "bool") { vals.push(el.classList.contains("on")); raws.push(null); continue; }
    const s = el.value.trim();
    raws.push(s);
    if (ty === "addr") { if (!ethers.isAddress(s)) return toast(l + ": invalid address", "bad"); vals.push(ethers.getAddress(s)); }
    else if (ty === "int") { if (!/^\d+$/.test(s)) return toast(l + ": enter a whole number", "bad"); vals.push(BigInt(s)); }
    else if (ty === "usdt") { const v = parse(s); if (v === null) return toast(l + ": invalid amount", "bad"); vals.push(v); }
    else if (ty === "text") { if (!s || s.length > 64) return toast(l + ": 1–64 characters", "bad"); vals.push(s); }
    else if (ty === "tok") vals.push(s);
  }
  if (a.fn === "rescueToken") {
    try { const d = await new ethers.Contract(vals[0], ERC20, S.read).decimals(); const v = parse(vals[2], Number(d)); if (v === null) throw 0; vals[2] = v; }
    catch { return toast("Amount: invalid or token unreadable", "bad"); }
  }
  if (a.check) { const r = a.check(vals); if (r !== true) return toast(r, "bad"); }
  if (a.danger && !confirm("Transfer ownership to " + vals[0] + "? You will lose admin access.")) return;
  await send(a.t, () => S.cw[a.fn](...vals));
}

window.addEventListener("load", () => {
  if (!window.ethers) { document.getElementById("planList").innerHTML = '<div class="card empty">Could not load web3 library. Check your connection and reload.</div>'; return; }
  init();
});
</script>
